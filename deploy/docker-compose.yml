# Production stack. Run from this folder: docker compose up -d --build
# Settings come from deploy/.env (copy .env.example). See docs/DEPLOYMENT.md.
name: cyrp

services:
  game:
    build:
      context: ..
      args:
        VITE_SOUNDS_URL: https://${SOUNDS_DOMAIN:?set SOUNDS_DOMAIN in deploy/.env}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      CLIENT_ORIGIN: https://${GAME_DOMAIN:?set GAME_DOMAIN in deploy/.env}
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_PUBLIC_URL: wss://${VOICE_DOMAIN:?set VOICE_DOMAIN in deploy/.env}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in deploy/.env}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in deploy/.env}
      SOUNDS_INTERNAL_URL: http://sounds:3100
      SOUNDS_SECRET: ${SOUNDS_SECRET:?set SOUNDS_SECRET in deploy/.env}
      # Allowed by the web app's Content Security Policy.
      SOUNDS_PUBLIC_URL: https://${SOUNDS_DOMAIN}
      # Accounts: "open" lets anyone sign up; otherwise a code from an admin is needed.
      ACCOUNT_CREATION: ${ACCOUNT_CREATION:-}
      ADMIN_USERNAMES: ${ADMIN_USERNAMES:-}
      # Same value as for the sounds service: the web app shows the YouTube field when on.
      ENABLE_YOUTUBE_DOWNLOADS: ${ENABLE_YOUTUBE_DOWNLOADS:-false}
    # The accounts database (back it up).
    volumes:
      - game-data:/app/data
    ports:
      # Only nginx on this machine talks to it.
      - 127.0.0.1:3000:3000
    depends_on:
      - livekit
      - sounds

  # The sound library: SQLite + audio files in the sounds-data volume (back it up).
  sounds:
    build:
      context: ..
      dockerfile: apps/sounds/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3100
      CLIENT_ORIGIN: https://${GAME_DOMAIN}
      SOUNDS_PUBLIC_URL: https://${SOUNDS_DOMAIN}
      SOUNDS_SECRET: ${SOUNDS_SECRET:?set SOUNDS_SECRET in deploy/.env}
      USER_SOUNDS_QUOTA_MB: ${USER_SOUNDS_QUOTA_MB:-200}
      # Sounds from YouTube links (off by default); see docs/DEPLOYMENT.md.
      ENABLE_YOUTUBE_DOWNLOADS: ${ENABLE_YOUTUBE_DOWNLOADS:-false}
      # Optional: a signed-in YouTube session's cookies, inside the sounds-data volume.
      YTDLP_COOKIES: ${YTDLP_COOKIES:-}
    volumes:
      - sounds-data:/app/data
    ports:
      # Only nginx on this machine talks to it.
      - 127.0.0.1:3100:3100

  livekit:
    image: livekit/livekit-server:v1.13.10
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: '${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}'
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      # Signaling (wss), proxied by nginx.
      - 127.0.0.1:7880:7880
      # Media: must be reachable from the internet (open them in the firewall).
      - 7881:7881/tcp
      - 7882:7882/udp

volumes:
  game-data:
  sounds-data:
