# Local LiveKit server in dev mode (API key "devkey", secret "secret").
services:
  livekit:
    image: livekit/livekit-server:latest
    # --node-ip: advertise localhost to browsers instead of the container's internal IP,
    # which isn't reachable from the host on Docker Desktop (Windows/macOS).
    command: --dev --bind 0.0.0.0 --node-ip 127.0.0.1
    ports:
      - '7880:7880' # HTTP / WebSocket signaling
      - '7881:7881' # WebRTC over TCP
      - '7882:7882/udp' # WebRTC over UDP
